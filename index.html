<head>
  <meta charset="UTF-8" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/brand/mascot-bust.png" />
  <meta name="theme-color" content="#0d0d0f" />
  <meta name="robots" content="index, follow" />
  <meta name="keywords" content="convert images online, image to vector converter, compress video online, compress image online, free pdf tools, browser file converter, no upload file converter" />

  <!-- Open Graph / Facebook, LinkedIn -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Convertly" />
  <meta property="og:url" content="https://convertly.is-cool.dev/" />
  <meta property="og:title" content="Convertly. Convert. Vectorize. Compress." />
  <meta property="og:description" content="Convert images, vectorize graphics, and compress media and video, entirely in your browser. No account, no upload to a server." />
  <meta property="og:image" content="https://convertly.is-cool.dev/logo-banner.png" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@Ememzyvisuals" />
  <meta name="twitter:title" content="Convertly. Convert. Vectorize. Compress." />
  <meta name="twitter:description" content="Convert images, vectorize graphics, and compress media and video, entirely in your browser. No account, no upload to a server." />
  <meta name="twitter:image" content="https://convertly.is-cool.dev/logo-banner.png" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Convertly",
      "url": "https://convertly.is-cool.dev/",
      "description": "Convert images, vectorize graphics, and compress media and video, entirely in your browser. No account, no upload to a server.",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Any (runs in a web browser)",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "author": { "@type": "Person", "name": "Emmanuel Ariyo (Ememzyvisuals)" }
    }
  </script>

  <script>
    // Applied synchronously, before first paint, to avoid a flash of the wrong theme.
    // Convertly is dark-first by design. Light mode is opt-in and remembered per browser.
    (function () {
      try {
        var saved = localStorage.getItem("convertly:theme");
        if (saved === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    })();
    // Same idea for the language attribute: read the saved preference before paint so the
    // page's own lang matches what main.ts is about to render, for accessibility and SEO.
    (function () {
      try {
        var lang = localStorage.getItem("convertly:lang");
        document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
